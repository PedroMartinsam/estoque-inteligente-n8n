# Configuracao do Servidor
server.port=8080

# Configuracao do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=4215

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===== Integracao com o n8n (adicione ao seu application.properties) =====

# URL de PRODUCAO do webhook (workflow precisa estar ATIVO no n8n).
# Para testar pelo editor do n8n (botao "Test workflow"), troque /webhook/ por /webhook-test/
n8n.webhook.url=http://localhost:5678/webhook/estoque-chat

# O agente pode chamar varias tools + OpenAI antes de responder
n8n.timeout.conexao-ms=5000
n8n.timeout.leitura-ms=120000
